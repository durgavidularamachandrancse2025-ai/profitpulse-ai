<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProfitPulse | AI Profit Forensics</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 30px;
            font-weight: 700;
        }

        .subtitle {
            color: #687386;
            margin-top: 6px;
        }

        .status {
            background: #e8f7ed;
            color: #20844a;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .card-title {
            color: #687386;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 25px;
            font-weight: bold;
        }

        .positive {
            color: #20844a;
        }

        .section {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .section h2 {
            margin-bottom: 18px;
        }

        .alert {
            border-left: 5px solid #d64545;
            background: #fff4f4;
            padding: 18px;
            border-radius: 8px;
        }

        .alert h3 {
            margin-bottom: 8px;
        }

        .button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }

        .primary {
            background: #172033;
            color: white;
        }

        .secondary {
            background: #edf0f5;
            color: #172033;
            margin-left: 10px;
        }

        .button:hover {
            opacity: 0.85;
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f5f7fb;
            border-radius: 10px;
            line-height: 1.6;
        }

        .driver {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .driver:last-child {
            border-bottom: none;
        }

        .
